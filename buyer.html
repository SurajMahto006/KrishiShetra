<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KrishiLink — B2B Agricultural Procurement Platform</title>
  <meta name="description" content="Production-grade agricultural procurement, lot discovery, quality analytics, digital offer negotiation, order tracking, and escrow payments for verified buyers.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/buyer.css">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body class="buyer-body">

  <!-- Ambient Background -->
  <div class="buyer-ambient-bg" aria-hidden="true"></div>

  <!-- APPLICATION SHELL -->
  <div class="buyer-layout">

    <!-- ═══ SIDEBAR ═══ -->
    <aside class="buyer-sidebar" id="buyer-sidebar">
      <div class="buyer-sidebar__brand">
        <div class="buyer-sidebar__logo-icon">🌿</div>
        <span class="buyer-sidebar__brand-name">KrishiLink</span>
        <span class="buyer-sidebar__badge">BUYER</span>
      </div>

      <nav class="buyer-sidebar__nav">
        <a href="#/buyer/dashboard" class="buyer-nav-item active" data-route="/buyer/dashboard">
          <i data-lucide="layout-dashboard"></i> Dashboard
        </a>
        <a href="#/buyer/marketplace" class="buyer-nav-item" data-route="/buyer/marketplace">
          <i data-lucide="store"></i> Marketplace
        </a>
        <a href="#/buyer/lots" class="buyer-nav-item" data-route="/buyer/lots">
          <i data-lucide="package-search"></i> My Lots
        </a>
        <a href="#/buyer/offers" class="buyer-nav-item" data-route="/buyer/offers">
          <i data-lucide="message-square"></i> Offers & Bids
        </a>
        <a href="#/buyer/orders" class="buyer-nav-item" data-route="/buyer/orders">
          <i data-lucide="clipboard-check"></i> Orders
        </a>
        <a href="#/buyer/logistics" class="buyer-nav-item" data-route="/buyer/logistics">
          <i data-lucide="map-pin"></i> Logistics
        </a>
        <a href="#/buyer/payments" class="buyer-nav-item" data-route="/buyer/payments">
          <i data-lucide="credit-card"></i> Payments
        </a>

        <hr class="buyer-sidebar__divider">

        <a href="#/buyer/profile" class="buyer-nav-item" data-route="/buyer/profile">
          <i data-lucide="user-check"></i> Profile
        </a>
      </nav>

      <!-- KYC Status Card -->
      <div class="buyer-sidebar__kyc-box">
        <div class="buyer-sidebar__kyc-status">
          <i data-lucide="shield-check" style="width:13px;height:13px;"></i> KYC VERIFIED
        </div>
        <div class="buyer-sidebar__kyc-sub">ABC Foods Pvt Ltd<br>Escrow Limit: ₹50,00,000</div>
        <a href="#/buyer/kyc-verification" class="buyer-sidebar__kyc-link">View Verification →</a>
      </div>
    </aside>

    <!-- ═══ MAIN WRAPPER ═══ -->
    <div class="buyer-main-wrapper">

      <!-- Top Header -->
      <header class="buyer-header">
        <div class="buyer-header__left">
          <button class="buyer-hamburger" id="buyer-hamburger" aria-label="Toggle sidebar menu" onclick="toggleMobileSidebar()">
            <i data-lucide="menu" style="width:20px;height:20px;"></i>
          </button>
          <div class="buyer-search-bar" id="buyer-search-wrapper">
            <i data-lucide="search"></i>
            <input type="text" id="global-buyer-search" placeholder="Search crops, mandis, lots, sellers..." autocomplete="off" aria-label="Global search">
            <div class="kl-search-results" id="kl-search-results"></div>
          </div>
        </div>

        <div class="buyer-header__right">
          <div style="position:relative;">
            <button class="buyer-icon-btn" id="btn-notifications" title="Notifications" aria-label="Notifications">
              <i data-lucide="bell"></i>
              <span class="buyer-icon-btn__badge"></span>
            </button>
            <div class="kl-notification-panel" id="kl-notification-panel"></div>
          </div>

          <a href="#/buyer/profile" class="buyer-profile-pill">
            <div class="buyer-profile-avatar">RP</div>
            <span class="buyer-profile-name">Rajesh Patil</span>
          </a>
        </div>
      </header>

      <!-- Dynamic Page Content -->
      <main class="buyer-page-container" id="buyer-page-content">
        <!-- Views injected by buyer-app.js -->
      </main>

    </div>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="buyer-mobile-nav">
    <a href="#/buyer/dashboard" class="buyer-mnav-item active" data-route="/buyer/dashboard">
      <i data-lucide="home"></i> Home
    </a>
    <a href="#/buyer/marketplace" class="buyer-mnav-item" data-route="/buyer/marketplace">
      <i data-lucide="store"></i> Market
    </a>
    <a href="#/buyer/offers" class="buyer-mnav-item" data-route="/buyer/offers">
      <i data-lucide="message-square"></i> Offers
    </a>
    <a href="#/buyer/orders" class="buyer-mnav-item" data-route="/buyer/orders">
      <i data-lucide="clipboard-check"></i> Orders
    </a>
    <a href="#/buyer/profile" class="buyer-mnav-item" data-route="/buyer/profile">
      <i data-lucide="user"></i> Profile
    </a>
  </nav>

  <!-- ═══ MODAL OVERLAY ═══ -->
  <div class="kl-modal-overlay" id="kl-modal-overlay" onclick="closeModalOnBackdrop(event)">
    <div class="kl-modal" id="kl-modal">
      <div class="kl-modal__header">
        <h3 class="kl-modal__title" id="kl-modal-title"></h3>
        <button class="kl-modal__close" onclick="closeModal()" aria-label="Close modal">✕</button>
      </div>
      <div class="kl-modal__body" id="kl-modal-body"></div>
      <div class="kl-modal__footer" id="kl-modal-footer"></div>
    </div>
  </div>

  <!-- ═══ TOAST CONTAINER ═══ -->
  <div class="kl-toast-container" id="kl-toast-container"></div>

  <!-- Sidebar Mobile Overlay -->
  <div id="sidebar-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:99;display:none;" onclick="toggleMobileSidebar()"></div>

  <!-- JS Modules -->
  <script src="js/buyer-data.js"></script>
  <script src="js/buyer-app.js"></script>
</body>
</html>
